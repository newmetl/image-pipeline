<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Style A – Tech/Futuristic (Landscape 1792×1024)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1792px;
      height: 1024px;
      overflow: visible;
      position: relative;
      font-family: 'Open Sans', sans-serif;

      /* ─── Default background for browser preview ───────────────────────────
         This gradient is only visible when editing locally in the browser.
         At render time, the generator replaces it with the DALL-E image.
      ──────────────────────────────────────────────────────────────────────── */
      background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 40%, #0d2038 70%, #0a1020 100%);
      background-size: cover;
      background-position: center;
    }

    /* ─── Gradient overlay (links nach rechts ausfadend) ─── */
    .gradient-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to right,
        rgba(0, 0, 0, 0.65) 0%,
        rgba(0, 0, 0, 0.65) 55%,
        rgba(0, 0, 0, 0) 100%
      );
      pointer-events: none;
    }

    /* ─── Text-Block ─── */
    #text-block {
      position: absolute;
      top: 3.3vw;
      left: 3.3vw;
      max-width: 54%;
      z-index: 10;
    }

    #text-block p {
      font-family: 'Open Sans', sans-serif;
      font-weight: 700;
      font-size: 5vw;
      line-height: 1.25;
      color: #ffffff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="gradient-overlay"></div>

  <!-- ─── Text-Block ─────────────────────────────────────────────────────────
       id="text-block" NICHT entfernen – der Generator ersetzt diesen Inhalt.
       Für die Browser-Vorschau kannst du hier Beispieltext eintragen.
  ──────────────────────────────────────────────────────────────────────────── -->
  <div id="text-block">
    <p>Your Headline</p>
    <p>Goes Here</p>
  </div>

  <script>
    /* ─── Scale-to-fit: shrink font until text fits canvas height ─── */
    (function() {
      function scaleToFit() {
        var block = document.getElementById('text-block');
        if (!block) return;
        var canvasH = document.body.offsetHeight;
        var ps = block.querySelectorAll('p');
        if (!ps.length) return;
        // Reset to CSS default first
        ps.forEach(function(p) { p.style.fontSize = ''; });
        var baseFontSize = parseFloat(window.getComputedStyle(ps[0]).fontSize);
        var minFontSize = baseFontSize * 0.4;
        var fontSize = baseFontSize;
        while (block.scrollHeight + block.offsetTop > canvasH && fontSize > minFontSize) {
          fontSize -= 1;
          ps.forEach(function(p) { p.style.fontSize = fontSize + 'px'; });
        }
      }
      // Run after fonts load AND after any injected scripts modify the DOM
      function scheduleScaleToFit() {
        var fontsReady = document.fonts ? document.fonts.ready : Promise.resolve();
        fontsReady.then(function() {
          requestAnimationFrame(function() { requestAnimationFrame(scaleToFit); });
        });
      }
      // Watch for text-block content changes (preview server + Puppeteer inject text)
      var observer = new MutationObserver(scheduleScaleToFit);
      document.addEventListener('DOMContentLoaded', function() {
        var block = document.getElementById('text-block');
        if (block) observer.observe(block, { childList: true, characterData: true, subtree: true });
        scheduleScaleToFit();
      });
    })();
  </script>
</body>
</html>
